<script>window.uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);window.isNative=()=>false;window.cloudRender=()=>false;window.cloudCard=()=>"";window.doPrint=()=>window.print();window.cloud={};</script>
<script>
const LOGO=`<svg width="52" height="52" viewBox="0 0 48 48" aria-label="Little Leaders logo"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1f44"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs><rect width="48" height="48" rx="11" fill="url(#lg2)"/><polygon points="15,17 15,22 24,26 33,22 33,17" fill="#cfe0ee"/><polygon points="24,8 39,14 24,20 9,14" fill="#fff"/><line x1="38" y1="14.5" x2="38" y2="23" stroke="#f5c04b" stroke-width="1.2"/><circle cx="38" cy="23.5" r="1.3" fill="#f5c04b"/><text x="24" y="40" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">LL</text><rect x="16" y="43" width="16" height="1.2" fill="#7ee0d4"/></svg>`;
const KEY='llcc_data_tuition_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const curMonth=()=>today().slice(0,7);
const money=n=>'Rs '+Number(n||0).toLocaleString('en-PK');
const LBL={P:'Present',A:'Absent',L:'Leave'};

function seed(){
  const names=[['Ali Raza','Class 5','0300-1112233',2500],['Ayesha Khan','Class 5','0311-2223344',2500],['Hamza Ahmed','Class 8','0321-3334455',3000],['Fatima Noor','Class 8','0333-4445566',3000],['Usman Tariq','Computer','0345-5556677',2000],['Zainab Bibi','Computer','0301-6667788',2000]];
  const d={students:[],att:{},pays:[],next:1,pid:1,demo:true};
  names.forEach(n=>d.students.push({id:'LL-'+String(d.next++).padStart(3,'0'),name:n[0],cls:n[1],phone:n[2],fee:n[3]}));
  for(let k=0;k<12;k++){const dt=new Date();dt.setDate(dt.getDate()-k);if(dt.getDay()===0)continue;const rec={};
    d.students.forEach((s,i)=>{rec[s.id]=((i*3+k*5)%7===0)?'A':((i+k)%9===0)?'L':'P'});d.att[ymd(dt)]=rec}
  const pm=new Date();pm.setMonth(pm.getMonth()-1,1);const prev=ymd(pm).slice(0,7),cm=curMonth();
  const add=(i,m,amt,day)=>d.pays.push({id:d.pid++,sid:d.students[i].id,month:m,amount:amt,date:m+'-'+day});
  add(0,prev,2500,'05');add(1,prev,2500,'06');add(2,prev,3000,'08');add(3,prev,1500,'10');
  add(0,cm,2500,'03');add(1,cm,1000,'04');add(2,cm,1500,'05');
  return d}
function preset(){
  const L=[['Taimoor',1000],['Kiran',1000],['Maryam',1000],['Talha',1000],['Abdulwahab',900],['Abdul Rasheed',900],['Suraim',900],['Usman',500],['Ahsan',500],['Ilyas',500],['Abu Hurairah',500],['Arman',500],['Ayan',500],['Sohaib',500],['Khaleel',300],['Fayaz',600],['Usaid',600],['Awais',800]];
  return {students:L.map((x,i)=>({id:'LL-'+String(i+1).padStart(3,'0'),name:x[0],cls:'Tuition',batch:'',guardian:'',gphone:'',phone:'',subjects:'',admDate:today(),fee:x[1],adm:0})),att:{},pays:[],tests:[],marks:{},next:L.length+1,pid:1,tid:1}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.students))return d}catch(e){}const d=(window.LL_CONFIG&&window.LL_CONFIG.DEMO===false)?{students:[],att:{},pays:[],next:1,pid:1}:preset();try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}return d}
function fix(d){d.next=d.next||d.students.length+1;d.pid=d.pid||d.pays.length+1;d.marks=d.marks||{};d.remarks=d.remarks||{};d.grades=d.grades||[[90,'A+'],[80,'A'],[70,'B'],[60,'C'],[50,'D'],[0,'F']];
  if(!d.tests){d.tests=[];d.tid=1;const c5=d.demo?d.students.filter(s=>s.cls==='Class 5'):[];if(c5.length)[['Mathematics',[45,28]],['English',[38,41]]].forEach(x=>{const id=d.tid++;d.tests.push({id,cls:'Class 5',subject:x[0],month:curMonth(),date:today(),total:50,pass:17});d.marks[id]={};c5.forEach((s,i)=>d.marks[id][s.id]=x[1][i]??30)})}
  d.tid=d.tid||d.tests.reduce((a,t)=>Math.max(a,t.id),0)+1;d.pays.forEach(p=>{if(!p.cref)p.cref='legacy-pay-'+p.id});d.tests.forEach(t=>{if(!t.cref)t.cref='legacy-test-'+t.id});if(d.off===undefined)d.off=0;d.teacher=d.teacher||'Sir Kamran Zahoor';d.lang=d.lang||'ur';d.cname=d.cname||'Little Leaders Coaching and Computer Centre';return d}
let db=fix(load());save();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save data. Browser storage may be full or blocked.')}if(typeof queueSync==='function')queueSync()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}

const act=()=>db.students.filter(s=>!s.archived);
const classes=()=>[...new Set(act().map(s=>s.cls))].sort();
const stuName=id=>{const s=db.students.find(x=>x.id===id);return s?s.name:id};
const paidFor=(sid,m)=>db.pays.filter(p=>p.sid===sid&&p.month===m).reduce((a,p)=>a+p.amount,0);
const statusOf=(fee,paid)=>paid<=0?'Unpaid':paid>=fee?'Paid':'Partial';

let tab='dash',editId=null,showForm=false;
let A={date:today(),cls:'',stu:'',draft:{},dirty:false,month:curMonth()};
let F={month:curMonth(),filter:''};
const TABS=[['dash','🏠','Home'],['stu','👩‍🎓','Students'],['att','✅','Attendance'],['fee','💰','Fees'],['tst','📝','Tests'],['rep','📊','Reports'],['msg','💬','Messages'],['set','⚙️','Settings']];
function setTab(t){tab=t;S.prof=null;T.id=null;T.rc=null;F.rcpt=null;showForm=false;editId=null;render()}
function render(){
  if(cloudRender())return;
  if(db.theme)document.documentElement.dataset.theme=db.theme;applyBrand();
  $('#nav').innerHTML=TABS.filter(t=>!(window.cloud&&cloud.profile&&cloud.profile.role==='teacher'&&t[0]==='fee')).map(t=>`<button class="${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
  ({dash:rDash,stu:rStu,att:rAtt,fee:rFee,tst:rTst,rep:rRep,msg:rMsg,set:rSet})[tab]();if(UPD&&$('#app').insertAdjacentHTML)$('#app').insertAdjacentHTML('afterbegin','<div class="warn noprint" onclick="refreshApp()" style="cursor:pointer">🔄 New version '+UPD+' is ready. Tap here to update.</div>');window.scrollTo(0,0);
  const on=$('#nav .on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'})}

/* ---------- Helpers ---------- */
const attOf=(s,m)=>{let p=0,a=0,l=0;for(const d in db.att){if(d.startsWith(m)&&!offD(d)){const v=db.att[d][s.id];if(v==='P')p++;else if(v==='A')a++;else if(v==='L')l++}}const t=p+a+l;return{p,a,l,t,pc:t?Math.round(p/t*100):null}};
const dueFor=(s,m)=>(s.fee||0)+(((s.adm||0)>0&&(s.admDate||'').slice(0,7)===m)?s.adm:0);
const lastPay=n=>[...db.pays].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,n);
const empty=t=>`<p class="mu">${t}</p>`;
const offD=d=>db.off>=0&&new Date(d+'T00:00:00').getDay()===db.off;
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function backupWarn(){const d=db.lastBackup;if(!d)return '<div class="warn">No backup taken yet. Go to Settings and tap Download backup.</div>';const n=Math.floor((new Date(today()+'T00:00:00')-new Date(d+'T00:00:00'))/864e5);return n>=7?`<div class="warn">Your last backup was ${n} days ago. Go to Settings and tap Download backup.</div>`:''}
/* ---------- Dashboard ---------- */
const greet=()=>{const h=new Date().getHours();return (h<12?'Good morning':h<17?'Good afternoon':'Good evening')+(db.teacher?', '+db.teacher:'')};
function rDash(){
  const td=today(),rec=db.att[td]||{},c={P:0,A:0,L:0},m=curMonth(),L=act();
  L.forEach(s=>{if(rec[s.id])c[rec[s.id]]++});
  let tot=0,col=0,due=0;const pend=[];
  L.forEach(s=>{const d=dueFor(s,m),p=paidFor(s.id,m);tot+=d;col+=p;due+=Math.max(0,d-p);if(d-p>0)pend.push({s,b:d-p})});
  pend.sort((a,b)=>b.b-a.b);
  const ab=L.filter(s=>rec[s.id]==='A'),up=db.tests.filter(t=>t.date>=td).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3),rp=lastPay(4);
  const rowOf=(s,txt,btn)=>`<div class="row sp" style="margin:6px 0"><div class="who">${av(s,36)}<div><b>${esc(s.name)}</b>${txt?`<div class="mu">${txt}</div>`:''}</div></div>${btn}</div>`;
  $('#app').innerHTML=`${(()=>{const n=c.P+c.A+c.L,pp=n?Math.round(c.P/n*100):0;return `<div class="hero"><div style="min-width:0"><div class="hi">${esc(greet())}</div><div class="dt">${longDate(td)}</div><div class="sub">${L.length} students · ${money(tot)} monthly fees</div></div><div class="ring" style="--p:${pp}"><div><b>${pp}%</b><small>present</small></div></div></div>`})()}
  ${offD(td)?'<div class="warn" style="background:#eff6ff;border-color:#93c5fd;color:#1e3a8a">Today is the weekly holiday. Attendance is off.</div>':''}
  <div class="row noprint" style="margin-bottom:10px"><button class="btn s" onclick="setTab('stu');showForm=true;render()">+ Add student</button><button class="btn s" onclick="setTab('att')">✅ Attendance</button><button class="btn s" onclick="setTab('fee');payPick()">💰 Payment</button><button class="btn s" onclick="setTab('msg')">💬 Message parents</button></div>
  <div class="grid"><div class="stat"><span>Students</span><strong>${L.length}</strong></div><div class="stat b"><span>Monthly fees</span><strong>${money(tot)}</strong></div>
  <div class="stat p"><span>Present today</span><strong>${c.P}</strong></div><div class="stat a"><span>Absent today</span><strong>${c.A}</strong></div><div class="stat l"><span>Leave today</span><strong>${c.L}</strong></div>
  <div class="stat p"><span>Collected (${m})</span><strong>${money(col)}</strong></div><div class="stat a"><span>Outstanding</span><strong>${money(due)}</strong></div><div class="stat b"><span>Upcoming tests</span><strong>${up.length}</strong></div></div>
  <div class="card"><h3>Absent today</h3>${ab.map(s=>rowOf(s,'',`<button class="btn s o" onclick="msgModal('${s.id}','abs','${m}')">Message</button>`)).join('')||empty(offD(td)?'Weekly holiday.':(Object.keys(rec).length?'Nobody is absent today.':'Attendance is not marked yet today.'))}</div>
  <div class="card"><div class="row sp"><h3 style="margin:0">Fees pending (${m})</h3><button class="btn s o" onclick="M.who='fee';setTab('msg')">Message all</button></div>${pend.slice(0,6).map(x=>rowOf(x.s,'Balance '+money(x.b),`<button class="btn s o" onclick="msgModal('${x.s.id}','fee','${m}')">Remind</button>`)).join('')||empty('No pending fees.')}${pend.length>6?`<p class="mu">+ ${pend.length-6} more in Fees</p>`:''}</div>
  <div class="card"><h3>Upcoming tests</h3>${up.map(t=>`<div class="mu">${t.date} · ${esc(t.subject)}</div>`).join('')||empty('No upcoming tests.')}</div>
  <div class="card"><h3>Recent payments</h3>${rp.map(p=>`<div class="mu">${p.date} · ${esc(stuName(p.sid))} · <b>${money(p.amount)}</b></div>`).join('')||empty('No payments yet.')}</div>
  ${backupWarn()}<div class="warn">⚠️ Records are saved only on this phone. Clearing browser data erases them. Make a backup in Settings regularly.</div>`}
async function backup(){const txt=JSON.stringify(db,null,2),name='little-leaders-backup-'+today()+'.json';
  if(isNative()){try{await nativeShareFile(name,txt);db.lastBackup=today();save();toast('Choose where to save the backup');return true}catch(e){alert('Backup failed: '+e.message);return false}}
  const b=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);db.lastBackup=today();save();toast('Backup downloaded');return true}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.students)||typeof d.att!=='object'||!Array.isArray(d.pays))throw 0;
    if(!confirm('This will replace all current data with the backup. Continue?'))return;
    d.next=d.next||d.students.length+1;d.pid=d.pid||d.pays.length+1;db=fix(d);save();toast('Backup restored');render()}catch(e){alert('Invalid backup file.')}inp.value=''};
  r.readAsText(f)}

/* ---------- Students ---------- */
let S={q:'',f:'',arch:false,prof:null};
const sf=(id,l,v,t='text',x='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v==null?'':v)}" ${x}>`;
function rStu(){
  if(S.prof)return rProf();
  if(!showForm)PH=undefined;
  const e=db.students.find(s=>s.id===editId)||{};
  const opts=[...new Set([...db.students.map(s=>s.cls),...db.students.map(s=>s.batch).filter(Boolean)])].sort();
  const form=showForm?`<div class="card"><h3>${editId?'Edit student':'Add student'} / طالب علم</h3>${editId?'':sf('fi','Student ID (leave blank for automatic)','')}${sf('fn','Name / نام *',e.name)}<label>Photo</label><div class="row" style="align-items:center;flex-wrap:nowrap"><span id="phv" style="flex:none">${av(e,64)}</span><div class="row" style="gap:6px"><button class="btn s o" onclick="pickPhoto(editId||'__form',true)">📷 Camera</button><button class="btn s o" onclick="pickPhoto(editId||'__form')">🖼 Gallery</button><button class="btn s o" onclick="photoClear()">Remove</button></div></div>${editId?'<p class="mu">A new photo is saved immediately.</p>':'<p class="mu">The photo is saved when you tap Save.</p>'}${sf('fc','Class / جماعت *',e.cls||'Tuition','text','list="cl"')}<datalist id="cl">${classes().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  ${sf('fb','Batch / بیچ',e.batch)}${sf('fa','Admission date',e.admDate||today(),'date')}${sf('fs','Subjects (comma separated)',e.subjects)}${sf('fg','Guardian name',e.guardian)}${sf('fp','Contact number (optional)',e.phone,'tel')}${sf('fq','Guardian phone',e.gphone,'tel')}${sf('ff','Monthly fee (PKR) *',e.fee,'number','min="0"')}${sf('fd','Admission / other charge (PKR, added to admission month)',e.adm||0,'number','min="0"')}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveStu()">Save</button><button class="btn o" onclick="showForm=false;editId=null;render()">Cancel</button></div></div>`:'';
  $('#app').innerHTML=`<div class="row sp"><h2>Students / طلبہ</h2><button class="btn s" onclick="showForm=true;editId=null;render()">+ Add</button></div>${form}
  <input placeholder="🔍 Search students (name or ID)" value="${esc(S.q)}" oninput="S.q=this.value;fillStu()"><div class="mu" style="margin:8px 2px">${act().length} students · ${money(act().reduce((a,x)=>a+(x.fee||0),0))} monthly fees · <a href="#" onclick="S.arch=!S.arch;fillStu();return false">${S.arch?'Show active students':'Show deactivated'}</a></div><div id="sl" style="margin-top:10px"></div>`;
  fillStu();if(showForm)$('#fn').focus()}
function fillStu(){
  const q=S.q.toLowerCase(),list=db.students.filter(s=>!!s.archived===S.arch&&(!q||(s.name+' '+s.id).toLowerCase().includes(q))&&(!S.f||s.cls===S.f||s.batch===S.f)).sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name));
  let last='';
  $('#sl').innerHTML=(list.length?`<p class="mu">${list.length} student(s)</p>`:empty('No students found.'))+list.map(s=>{
    const h=s.cls!==last?`<h3 style="margin-top:12px">${esc(s.cls)}</h3>`:'';last=s.cls;
    return h+`<div class="card"><div class="who">${avEdit(s,52)}<div style="flex:1;min-width:0"><b>${esc(s.name)}</b><div class="mu">${esc(s.id)}${s.batch?' · '+esc(s.batch):''}</div><div class="mu">📞 ${esc(s.gphone||s.phone||'-')}</div></div><span class="feeb">${money(s.fee)}<small>/month</small></span></div>
    <div class="row" style="margin-top:8px"><button class="btn s" onclick="S.prof='${s.id}';render()">Profile</button><button class="btn s o" onclick="editStu('${s.id}')">Edit</button><button class="btn s a" onclick="archStu('${s.id}')">${s.archived?'Reactivate':'Deactivate'}</button>${s.archived?`<button class="btn s r" onclick="delStu('${s.id}')">Delete</button>`:''}</div></div>`}).join('')}
function editStu(id){editId=id;showForm=true;render()}
function archStu(id){const s=db.students.find(x=>x.id===id);if(!s.archived&&!confirm('Deactivate '+s.name+'? Records are kept and you can reactivate later.'))return;s.archived=!s.archived;save();toast(s.archived?'Deactivated':'Reactivated');fillStu()}
function saveStu(){const v=k=>$('#'+k).value.trim();
  const name=v('fn'),cls=v('fc'),phone=v('fp'),guardian=v('fg'),fee=parseFloat(v('ff')),adm=parseFloat(v('fd'))||0;
  if(!name||!cls||isNaN(fee)||fee<0||adm<0){alert('Please fill name, class and a valid fee.');return}
  const o={name,cls,phone,guardian,fee,adm,batch:v('fb'),admDate:v('fa'),subjects:v('fs'),gphone:v('fq')};if(PH!==undefined)o.photo=PH||undefined;
  if(editId)Object.assign(db.students.find(x=>x.id===editId),o);
  else{let id=v('fi').toUpperCase();
    if(id){if(db.students.some(x=>x.id.toUpperCase()===id)){alert('This Student ID already exists. Choose another or leave it blank.');return}}
    else do{id='LL-'+String(db.next++).padStart(3,'0')}while(db.students.some(x=>x.id===id));
    db.students.push({id,...o})}
  save();showForm=false;editId=null;toast('Student saved');render()}
function delStu(id){
  if(!confirm('PERMANENTLY delete '+stuName(id)+' and all attendance, payment and marks records? This cannot be undone.'))return;
  db.students=db.students.filter(x=>x.id!==id);db.pays=db.pays.filter(p=>p.sid!==id);
  Object.keys(db.att).forEach(d=>{delete db.att[d][id];if(!Object.keys(db.att[d]).length)delete db.att[d]});
  Object.values(db.marks).forEach(m=>delete m[id]);save();toast('Student deleted');fillStu()}
function rProf(){const s=db.students.find(x=>x.id===S.prof);if(!s){S.prof=null;return rStu()}
  const m=curMonth(),a=attOf(s,m),all={P:0,A:0,L:0};Object.keys(db.att).forEach(d=>{const r=db.att[d];if(r[s.id]&&!offD(d))all[r[s.id]]++});
  const ps=db.pays.filter(p=>p.sid===s.id).sort((x,y)=>y.date.localeCompare(x.date)),d=dueFor(s,m),pd=paidFor(s.id,m);
  const ts=db.tests.filter(t=>t.cls===s.cls&&(db.marks[t.id]||{})[s.id]!=null).sort((x,y)=>y.date.localeCompare(x.date));
  $('#app').innerHTML=`<div class="row sp noprint"><button class="btn s o" onclick="S.prof=null;render()">← Back</button><button class="btn s" onclick="tab='tst';T.rc='${s.id}';T.month=curMonth();render()">Report card</button><button class="btn s o" onclick="msgModal('${s.id}','prog',curMonth())">Send to parent</button></div>
  <div class="card" style="margin-top:10px"><div class="who">${avEdit(s,68)}<h2 style="margin:0">${esc(s.name)} ${s.archived?'<span class="tag L">Inactive</span>':''}</h2></div><div class="mu">${s.id} · ${esc(s.cls)}${s.batch?' · '+esc(s.batch):''} · Admitted ${s.admDate||'-'}</div>
  <div class="mu">Guardian: ${esc(s.guardian||'-')} · ${esc(s.gphone||'-')} · Student: ${esc(s.phone)}</div><div class="mu">Subjects: ${esc(s.subjects||'-')}</div></div>
  <div class="card"><h3>Attendance</h3><div class="mu">This month: P ${a.p} · A ${a.a} · L ${a.l}${a.pc==null?'':' · '+a.pc+'%'}</div><div class="mu">All time: P ${all.P} · A ${all.A} · L ${all.L}</div></div>
  <div class="card"><h3>Fees (${m})</h3><div class="mu">Due ${money(d)} · Paid ${money(pd)} · Balance ${money(Math.max(0,d-pd))} · ${statusOf(d,pd)}</div>${ps.map(p=>`<div class="mu">${p.date} · ${money(p.amount)} · for ${p.month}${p.method?' · '+esc(p.method):''}${p.ref?' · Ref '+esc(p.ref):''}</div>`).join('')||empty('No payments yet.')}</div>
  <div class="card"><h3>Tests &amp; marks</h3>${ts.map(t=>{const o=db.marks[t.id][s.id];return `<div class="mu">${t.date} · ${esc(t.subject)} · ${o}/${t.total} · ${pct(o,t.total)}% · ${gradeOf(pct(o,t.total))} · ${o>=t.pass?'Pass':'Fail'}</div>`}).join('')||empty('No results yet.')}</div>`}

/* ---------- Attendance ---------- */
const inCls=()=>act().filter(s=>s.cls===A.cls);
function loadDraft(){const rec=db.att[A.date]||{};A.draft={};inCls().forEach(s=>A.draft[s.id]=rec[s.id]||'');A.dirty=false}
function rAtt(){
  const cl=classes();if(!cl.includes(A.cls))A.cls=cl[0]||'';
  if(!Object.keys(A.draft).length||inCls().some(s=>!(s.id in A.draft)))loadDraft();
  const list=offD(A.date)?[]:inCls().filter(s=>!A.stu||s.id===A.stu);
  const dates=Object.keys(db.att).filter(d=>!offD(d)).sort().reverse().slice(0,10);
  $('#app').innerHTML=`<h2>Attendance / حاضری</h2><div class="card">
  <div class="row"><div><label>Date / تاریخ</label><input type="date" value="${A.date}" onchange="A.date=this.value||today();loadDraft();rAtt()"></div>
  <div><label>Class / جماعت</label><select onchange="A.cls=this.value;A.stu='';loadDraft();rAtt()">${cl.map(c=>`<option ${c===A.cls?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
  <div class="mu" style="margin-top:8px">📅 <b>${longDate(A.date)}</b></div><label>Student filter / طالب علم</label><select onchange="A.stu=this.value;rAtt()"><option value="">All students</option>${inCls().map(s=>`<option value="${s.id}" ${s.id===A.stu?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
  <label>Recorded dates (tap to open)</label><div class="chips">${dates.map(d=>`<button class="${d===A.date?'on':''}" onclick="A.date='${d}';loadDraft();rAtt()">${d.slice(5)}</button>`).join('')||'<span class="mu">None yet</span>'}</div></div>
  ${offD(A.date)?'<div class="warn" style="background:#eff6ff;border-color:#93c5fd;color:#1e3a8a">'+DAYS[db.off]+' is the weekly holiday, so attendance is off for this date. Choose another date.</div>':''}<div class="row" style="${offD(A.date)?'display:none':''}"><button class="btn P" style="background:#15803d" onclick="markAll('P')">All Present</button><button class="btn r" onclick="markAll('A')">All Absent</button></div>
  <div style="margin-top:10px">${list.map(s=>`<div class="card"><div class="who">${av(s,42)}<div><b>${esc(s.name)}</b> <span class="mu">${s.id}</span></div></div>
  <div class="seg">${['P','A','L'].map(k=>`<button class="${k} ${A.draft[s.id]===k?'on':''}" onclick="mark('${s.id}','${k}')">${LBL[k]}</button>`).join('')}</div></div>`).join('')||(offD(A.date)?'':'<p class="mu">No students in this class.</p>')}</div>
  <div class="row sp" style="position:sticky;bottom:12px;${offD(A.date)?'display:none':''}"><span class="tag ${A.dirty?'L':'P'}">${A.dirty?'Unsaved changes':'Saved'}</span><button class="btn" onclick="saveAtt()">💾 Save attendance</button></div>
  ${dailyReport()}${report()}`}
function mark(id,k){if(offD(A.date))return;A.draft[id]=k;A.dirty=true;rAtt()}
function markAll(k){if(offD(A.date))return;inCls().forEach(s=>A.draft[s.id]=k);A.dirty=true;rAtt()}
function saveAtt(){if(offD(A.date)){alert('This date is the weekly holiday. Attendance cannot be saved.');return}
  const rec=db.att[A.date]||{};let n=0,un=0;
  inCls().forEach(s=>{const v=A.draft[s.id];if(v){rec[s.id]=v;n++}else{un++}});
  if(!n){alert('Mark at least one student first.');return}
  db.att[A.date]=rec;save();A.dirty=false;toast('Saved '+n+' record(s)'+(un?' · '+un+' not marked':''));rAtt()}
function report(){
  const m=A.month,rows=inCls().filter(s=>!A.stu||s.id===A.stu).map(s=>{let p=0,a=0,l=0;
    Object.keys(db.att).forEach(d=>{if(d.startsWith(m)&&!offD(d)){const v=db.att[d][s.id];if(v==='P')p++;else if(v==='A')a++;else if(v==='L')l++}});
    const t=p+a+l;return `<tr><td>${av(s,22)} ${esc(s.name)}</td><td>${p}</td><td>${a}</td><td>${l}</td><td><b>${t?Math.round(p/t*100)+'%':'-'}</b></td></tr>`}).join('');
  return `<div class="card" style="margin-top:12px"><div class="row sp"><h3>Monthly report / ماہانہ رپورٹ</h3><button class="btn s o noprint" onclick="doPrint()">🖨 Print</button></div><input type="month" value="${m}" onchange="A.month=this.value||curMonth();rAtt()">
  <p class="mu"><b>${rangeLabel(m)}</b> · Class: ${esc(A.cls)} · Generated ${fmtDate(today())}<br>Percentage = Present ÷ marked days. Holiday: ${db.off>=0?DAYS[db.off]:'none'}.</p><div style="overflow-x:auto"><table><tr><th>Student</th><th>P</th><th>A</th><th>L</th><th>%</th></tr>${rows}</table></div></div>`}

/* ---------- Fees ---------- */
function rFee(){
  if(F.rcpt)return rRcpt();
  const m=F.month;let tot=0,col=0,due=0;
  const rows=act().map(s=>{const d=dueFor(s,m),p=paidFor(s.id,m),st=statusOf(d,p);tot+=d;col+=p;due+=Math.max(0,d-p);return{s,d,p,st,bal:d-p}}).filter(r=>!F.filter||r.st===F.filter);
  $('#app').innerHTML=`<div class="row sp"><h2>Fees / فیس</h2><button class="btn s noprint" onclick="payPick()">+ Payment</button></div><div class="card"><label>Month / مہینہ</label><input type="month" value="${m}" onchange="F.month=this.value||curMonth();rFee()">
  <label>Status filter</label><select onchange="F.filter=this.value;rFee()"><option value="">All</option>${['Paid','Partial','Unpaid'].map(x=>`<option ${F.filter===x?'selected':''}>${x}</option>`).join('')}</select></div>
  ${feeEditor()}<div class="grid"><div class="stat"><span>Total fees due</span><strong>${money(tot)}</strong></div><div class="stat p"><span>Collected</span><strong>${money(col)}</strong></div><div class="stat a"><span>Outstanding</span><strong>${money(due)}</strong></div></div>
  ${rows.map(r=>`<div class="card"><div class="row sp"><div class="who">${av(r.s,42)}<div><b>${esc(r.s.name)}</b><div class="mu">${r.s.id}</div></div></div><span class="tag ${r.st}">${r.st==='Partial'?'Partially Paid':r.st}</span></div>
  <div class="mu" style="margin-top:6px">Due ${money(r.d)} · Paid ${money(r.p)} · <b style="color:${r.bal>0?'var(--red)':'#0d9488'}">Balance ${money(Math.max(0,r.bal))}</b></div>
  <div class="row" style="margin-top:8px"><button class="btn s" onclick="payForm('${r.s.id}')">+ Record payment</button><button class="btn s o" onclick="history('${r.s.id}')">History / receipts</button><button class="btn s o" onclick="msgModal('${r.s.id}','fee',F.month)">Reminder</button></div></div>`).join('')||empty('No records.')}`}
function rRcpt(){const p=db.pays.find(x=>x.id===F.rcpt);if(!p){F.rcpt=null;return rFee()}
  const s=db.students.find(x=>x.id===p.sid)||{name:p.sid,cls:'-',fee:0},d=dueFor(s,p.month),pd=paidFor(p.sid,p.month),row=(a,b)=>`<tr><td>${a}</td><td style="text-align:right">${b}</td></tr>`;
  $('#app').innerHTML=`<div class="row sp noprint"><button class="btn s o" onclick="F.rcpt=null;render()">← Back</button><button class="btn s" onclick="doPrint()">🖨 Print receipt</button></div>
  <div class="card" style="margin-top:10px"><div style="text-align:center">${LOGO}<h2 style="margin:0">${esc(db.cname)}</h2><b>FEE RECEIPT</b></div><table>${row('Receipt no.','RC-'+String(p.id).padStart(4,'0'))}${row('Date',p.date)}${row('Student',av(s,28)+' '+esc(s.name)+' ('+p.sid+')')}${row('Class',esc(s.cls))}${row('Fee month',p.month)}${row('Payment method',esc(p.method||'-'))}${row('Reference',esc(p.ref||'-'))}${row('<b>Amount paid</b>','<b>'+money(p.amount)+'</b>')}${row('Total paid for month',money(pd))}${row('Balance',money(Math.max(0,d-pd)))}</table><p class="mu">Thank you. This is a computer-generated receipt.</p></div>`}
function payPick(){if(!act().length){alert('Add a student first.');return}
  openM(`<h3>Record payment</h3><label>Student</label><select id="pp">${act().map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.cls)})</option>`).join('')}</select><div class="row" style="margin-top:12px"><button class="btn" onclick="payForm($('#pp').value)">Next</button><button class="btn o" onclick="closeM()">Cancel</button></div>`)}
function openM(h){$('#mbox').innerHTML=h;$('#modal').classList.add('show')}
function closeM(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function payForm(id){
  const s=db.students.find(x=>x.id===id),bal=Math.max(0,dueFor(s,F.month)-paidFor(id,F.month));
  openM(`<h3>Payment: ${esc(s.name)}</h3><p class="mu">Due ${money(dueFor(s,F.month))} · Balance for ${F.month}: ${money(bal)}</p>
  <label>Fee month</label><input type="month" id="pm" value="${F.month}">
  <label>Amount paid (PKR)</label><input type="number" id="pa" min="1" value="${bal||''}">
  <label>Payment date</label><input type="date" id="pd" value="${today()}"><label>Payment method</label><select id="pmeth"><option>Cash</option><option>JazzCash</option><option>Easypaisa</option><option>Bank transfer</option><option>Other</option></select><label>Reference (receipt / transaction no.)</label><input id="pr">
  <div class="row" style="margin-top:12px"><button class="btn" onclick="savePay('${id}')">Save payment</button><button class="btn o" onclick="closeM()">Cancel</button></div>`)}
function savePay(id){
  const month=$('#pm').value,amount=parseFloat($('#pa').value),date=$('#pd').value;
  if(!month||!date||isNaN(amount)||amount<=0){alert('Enter a valid month, amount and date.');return}
  const s=db.students.find(x=>x.id===id),bal=dueFor(s,month)-paidFor(id,month);
  if(amount>bal&&!confirm('Amount is more than the balance ('+money(Math.max(0,bal))+'). Save anyway?'))return;
  db.pays.push({id:db.pid++,sid:id,month,amount,date,ref:$('#pr').value.trim(),method:$('#pmeth').value,cref:uid()});save();closeM();toast('Payment saved');render()}
function history(id){
  const ps=db.pays.filter(p=>p.sid===id).sort((a,b)=>b.date.localeCompare(a.date));
  openM(`<h3>Payment history: ${esc(stuName(id))}</h3>${ps.map(p=>`<div class="row sp card"><div><b>${money(p.amount)}</b><div class="mu">${p.date} · for ${p.month}${p.method?' · '+esc(p.method):''}${p.ref?' · Ref '+esc(p.ref):''}</div></div><div class="row" style="flex:none"><button class="btn s o" onclick="closeM();tab='fee';F.rcpt=${p.id};render()">Receipt</button><button class="btn s r" onclick="delPay(${p.id},'${id}')">Delete</button></div></div>`).join('')||'<p class="mu">No payments yet.</p>'}
  <button class="btn o" style="width:100%" onclick="closeM()">Close</button>`)}
function delPay(pid,sid){if(!confirm('Delete this payment?'))return;db.pays=db.pays.filter(p=>p.id!==pid);save();history(sid);render()}
/* ---------- Tests & Results ---------- */
let T={month:curMonth(),cls:'',id:null,rc:null};
const pct=(o,t)=>t?Math.round(o/t*1000)/10:0;
const gradeOf=p=>{const g=[...db.grades].sort((a,b)=>b[0]-a[0]).find(x=>p>=x[0]);return g?g[1]:'-'};
const stuT=()=>act().filter(s=>s.cls===T.cls);
function rTst(){
  const cl=classes();if(!cl.includes(T.cls))T.cls=cl[0]||'';
  if(T.id)return rMarks();if(T.rc)return rCard();
  const ts=db.tests.filter(t=>t.month===T.month&&t.cls===T.cls);
  $('#app').innerHTML=`<h2>Tests &amp; Results / ٹیسٹ</h2><div class="card"><div class="row"><div><label>Month</label><input type="month" value="${T.month}" onchange="T.month=this.value||curMonth();rTst()"></div>
  <div><label>Class</label><select onchange="T.cls=this.value;rTst()">${cl.map(c=>`<option ${c===T.cls?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
  <div class="row" style="margin-top:10px"><button class="btn s" onclick="testForm()">+ New test</button><button class="btn s o" onclick="gradeForm()">Grade scale</button></div></div>
  ${ts.map(t=>`<div class="card"><b>${esc(t.subject)}</b> <span class="mu">${t.date} · Total ${t.total} · Pass ${t.pass}</span><div class="mu">${Object.keys(db.marks[t.id]||{}).length} result(s) entered</div>
  <div class="row" style="margin-top:8px"><button class="btn s" onclick="T.id=${t.id};rTst()">Enter / edit marks</button><button class="btn s r" onclick="delTest(${t.id})">Delete</button></div></div>`).join('')||'<p class="mu">No tests for this month and class. Tap + New test.</p>'}
  <h3 style="margin-top:14px">Report cards / رپورٹ کارڈ</h3>${stuT().map(s=>`<div class="card row sp"><div class="who">${av(s,36)}<b>${esc(s.name)}</b></div><button class="btn s o" onclick="T.rc='${s.id}';rTst()">Report card</button></div>`).join('')}`}
function testForm(){if(!T.cls){alert('Add a student with a class first.');return}
  openM(`<h3>New test: ${esc(T.cls)} · ${T.month}</h3><label>Subject</label><input id="ts"><label>Test date</label><input type="date" id="td" value="${today()}"><label>Total marks</label><input type="number" id="tt" value="100"><label>Passing marks</label><input type="number" id="tp" value="33">
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveTest()">Save</button><button class="btn o" onclick="closeM()">Cancel</button></div>`)}
function saveTest(){const subject=$('#ts').value.trim(),date=$('#td').value,total=parseFloat($('#tt').value),pass=parseFloat($('#tp').value);
  if(!subject||!date||!(total>0)||isNaN(pass)||pass<0||pass>total){alert('Enter subject, date, total marks, and passing marks between 0 and total.');return}
  db.tests.push({id:db.tid++,cls:T.cls,subject,month:T.month,date,total,pass,cref:uid()});save();closeM();rTst()}
function delTest(id){if(!confirm('Delete this test and all its marks?'))return;db.tests=db.tests.filter(t=>t.id!==id);delete db.marks[id];save();rTst()}
function rMarks(){const t=db.tests.find(x=>x.id===T.id),m=db.marks[t.id]||{};
  $('#app').innerHTML=`<div class="row sp"><h2>${esc(t.subject)} · ${t.month}</h2><button class="btn s o" onclick="T.id=null;rTst()">← Back</button></div><p class="mu">Total ${t.total}, pass ${t.pass}. Leave blank if absent.</p>
  ${stuT().map(s=>{const o=m[s.id],r=o==null?'':`<span class="tag ${o>=t.pass?'P':'A'}">${pct(o,t.total)}% · ${gradeOf(pct(o,t.total))} · ${o>=t.pass?'Pass':'Fail'}</span>`;
  return `<div class="card"><div class="row sp"><div class="who">${av(s,36)}<b>${esc(s.name)}</b></div>${r}</div><input type="number" step="0.5" min="0" max="${t.total}" id="m_${s.id}" value="${o==null?'':o}" placeholder="Obtained marks"></div>`}).join('')}
  <button class="btn" style="width:100%" onclick="saveMarks()">💾 Save marks</button>`}
function saveMarks(){const t=db.tests.find(x=>x.id===T.id),m={};
  for(const s of stuT()){const v=$('#m_'+s.id).value.trim();if(v==='')continue;const o=parseFloat(v);
    if(isNaN(o)||o<0||o>t.total){alert(s.name+': marks must be between 0 and '+t.total);return}m[s.id]=o}
  db.marks[t.id]=m;save();toast('Marks saved');rTst()}
function summary(s,month){let o=0,tt=0;const rows=db.tests.filter(t=>t.cls===s.cls&&t.month===month).map(t=>{const v=(db.marks[t.id]||{})[s.id];if(v!=null){o+=v;tt+=t.total}return{t,v}});return{rows,o,tt,p:pct(o,tt)}}
function rCard(){const s=db.students.find(x=>x.id===T.rc),m=T.month,r=summary(s,m);
  const peers=act().filter(x=>x.cls===s.cls).map(x=>({id:x.id,p:summary(x,m)})).filter(x=>x.p.tt>0).sort((a,b)=>b.p.p-a.p.p);
  const pos=peers.findIndex(x=>x.id===s.id)+1;let pa=0,ab=0,lv=0;
  Object.keys(db.att).forEach(d=>{if(d.startsWith(m)&&!offD(d)){const v=db.att[d][s.id];if(v==='P')pa++;else if(v==='A')ab++;else if(v==='L')lv++}});
  const at=pa+ab+lv,hist=[];
  db.tests.filter(t=>t.cls===s.cls&&(db.marks[t.id]||{})[s.id]!=null).sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>{const o=db.marks[t.id][s.id];hist.push(`<tr><td>${t.month}</td><td>${esc(t.subject)}</td><td>${o}/${t.total}</td><td>${pct(o,t.total)}%</td></tr>`)});
  $('#app').innerHTML=`<div class="row sp noprint"><button class="btn s o" onclick="T.rc=null;rTst()">← Back</button><button class="btn s" onclick="doPrint()">🖨 Print / Save as PDF</button></div>
  <div class="card" style="margin-top:10px"><div style="text-align:center">${LOGO}<h2 style="margin:0">${esc(db.cname)}</h2><div>Monthly Report Card · ${m}</div></div>
  <div class="who" style="justify-content:center;margin:10px 0">${av(s,76)}<div style="text-align:left"><b style="font-size:17px">${esc(s.name)}</b><div>ID ${s.id} · Class ${esc(s.cls)}</div></div></div>
  <div style="overflow-x:auto"><table><tr><th>Subject</th><th>Total</th><th>Obtained</th><th>%</th><th>Grade</th><th>Result</th></tr>
  ${r.rows.map(x=>x.v==null?`<tr><td>${esc(x.t.subject)}</td><td>${x.t.total}</td><td colspan="4">Not entered</td></tr>`:`<tr><td>${esc(x.t.subject)}</td><td>${x.t.total}</td><td>${x.v}</td><td>${pct(x.v,x.t.total)}</td><td>${gradeOf(pct(x.v,x.t.total))}</td><td>${x.v>=x.t.pass?'Pass':'Fail'}</td></tr>`).join('')||'<tr><td colspan="6">No tests this month</td></tr>'}
  <tr><th>Overall</th><th>${r.tt}</th><th>${r.o}</th><th>${r.p}</th><th>${r.tt?gradeOf(r.p):'-'}</th><th></th></tr></table></div>
  <p>${pos?`Class position: <b>${pos}</b> of ${peers.length}<br>`:''}Attendance: Present ${pa}, Absent ${ab}, Leave ${lv}${at?' · '+Math.round(pa/at*100)+'%':''}</p>
  <label>Teacher remarks</label><textarea style="width:100%;padding:10px;font:inherit;border:1px solid #b9c7b6;border-radius:8px" rows="3" onchange="db.remarks['${s.id}|${m}']=this.value;save();toast('Remarks saved')">${esc(db.remarks[s.id+'|'+m]||'')}</textarea></div>
  <div class="card noprint"><h3>Result history</h3><div style="overflow-x:auto"><table><tr><th>Month</th><th>Subject</th><th>Marks</th><th>%</th></tr>${hist.join('')||'<tr><td colspan="4">No results yet</td></tr>'}</table></div></div>`}
function gradeForm(){openM(`<h3>Grade scale</h3><p class="mu">Minimum % for each grade.</p>${db.grades.map((g,i)=>`<div class="row"><input type="number" id="gm${i}" value="${g[0]}"><input id="gl${i}" value="${esc(g[1])}"></div>`).join('')}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveGrades()">Save</button><button class="btn o" onclick="closeM()">Cancel</button></div>`)}
function saveGrades(){const g=db.grades.map((_,i)=>[parseFloat($('#gm'+i).value),$('#gl'+i).value.trim()]);
  if(g.some(x=>isNaN(x[0])||!x[1])||!g.some(x=>x[0]===0)){alert('Fill every row, and one grade must start at 0.');return}db.grades=g;save();closeM();toast('Grades saved')}

/* ---------- Reports ---------- */
let RP={type:'att',month:curMonth(),cls:''};
function resSheet(c,m){const ts=db.tests.filter(t=>t.cls===c&&t.month===m),rows=act().filter(s=>s.cls===c).map(s=>({s,r:summary(s,m)}));
  const rk=rows.filter(x=>x.r.tt>0).sort((a,b)=>b.r.p-a.r.p).map(x=>x.s.id);
  return `<div class="card"><h3>${esc(c)} · result sheet ${m}</h3>${ts.length?`<div style="overflow-x:auto"><table><tr><th>Student</th>${ts.map(t=>`<th>${esc(t.subject)}<br>/${t.total}</th>`).join('')}<th>%</th><th>Gr</th><th>Pos</th></tr>
  ${rows.map(x=>`<tr><td>${av(x.s,22)} ${esc(x.s.name)}</td>${x.r.rows.map(y=>`<td>${y.v==null?'-':y.v}</td>`).join('')}<td>${x.r.tt?x.r.p:'-'}</td><td>${x.r.tt?gradeOf(x.r.p):'-'}</td><td>${rk.indexOf(x.s.id)+1||'-'}</td></tr>`).join('')}</table></div>`:empty('No tests for this class and month.')}</div>`}
function rRep(){const cl=classes(),ty=RP.type,m=RP.month;if(RP.cls&&!cl.includes(RP.cls))RP.cls='';const cs=RP.cls?[RP.cls]:cl;let h='';
  if(ty==='att')h=cs.map(c=>{const rows=act().filter(s=>s.cls===c).map(s=>({s,a:attOf(s,m)})),P=rows.reduce((x,r)=>x+r.a.p,0),N=rows.reduce((x,r)=>x+r.a.t,0);
    return `<div class="card"><h3>${esc(c)} · attendance ${N?Math.round(P/N*100)+'%':'(no records)'}</h3><div style="overflow-x:auto"><table><tr><th>Student</th><th>P</th><th>A</th><th>L</th><th>%</th></tr>${rows.map(r=>`<tr><td>${av(r.s,22)} ${esc(r.s.name)}</td><td>${r.a.p}</td><td>${r.a.a}</td><td>${r.a.l}</td><td>${r.a.pc==null?'-':r.a.pc+'%'}</td></tr>`).join('')}</table></div></div>`}).join('');
  else if(ty==='fee'){let T1=0,T2=0;const rows=act().filter(s=>cs.includes(s.cls)).map(s=>{const d=dueFor(s,m),p=paidFor(s.id,m);T1+=d;T2+=p;return `<tr><td>${av(s,22)} ${esc(s.name)}</td><td>${d}</td><td>${p}</td><td>${Math.max(0,d-p)}</td><td>${statusOf(d,p)}</td></tr>`}).join('');
    h=`<div class="card"><h3>Fee report ${m} (PKR)</h3><div style="overflow-x:auto"><table><tr><th>Student</th><th>Due</th><th>Paid</th><th>Balance</th><th>Status</th></tr>${rows}<tr><th>Total</th><th>${T1}</th><th>${T2}</th><th>${Math.max(0,T1-T2)}</th><th></th></tr></table></div></div>`}
  else if(ty==='par')h=parList(cs,m);else h=cs.map(c=>resSheet(c,m)).join('');
  $('#app').innerHTML=`<div class="row sp"><h2>Reports / رپورٹس</h2><button class="btn s noprint" onclick="doPrint()">🖨 Print / Save as PDF</button></div><div class="card noprint"><div class="row"><div><label>Report</label><select onchange="RP.type=this.value;rRep()">${[['att','Attendance'],['fee','Fees'],['res','Results'],['par','Parent messages']].map(x=>`<option value="${x[0]}" ${ty===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
  <div><label>Month</label><input type="month" value="${m}" onchange="RP.month=this.value||curMonth();rRep()"></div><div><label>Class</label><select onchange="RP.cls=this.value;rRep()"><option value="">All classes</option>${cl.map(c=>`<option ${RP.cls===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div></div>${repHead()}${h||empty('No data.')}`}
/* ---------- Messages to parents ---------- */
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MU=['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
const monthName=m=>MN[+m.slice(5,7)-1]+' '+m.slice(0,4);
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='92'+d.slice(1);else if(d.length===10&&d.startsWith('3'))d='92'+d;return d}
function posOf(s,m){const pe=act().filter(x=>x.cls===s.cls).map(x=>({id:x.id,p:summary(x,m)})).filter(x=>x.p.tt>0).sort((a,b)=>b.p.p-a.p.p),i=pe.findIndex(x=>x.id===s.id);return i<0?'':(i+1)+'/'+pe.length}
function msgText(s,m,kind){
  const ur=db.lang!=='en',me=db.teacher||'Sir Kamran Zahoor',d=dueFor(s,m),p=paidFor(s.id,m),bal=Math.max(0,d-p);
  const mn=ur?MU[+m.slice(5,7)-1]+' '+m.slice(0,4):monthName(m),head=ur?'السلام علیکم!':'Assalam o Alaikum!';
  const sign=ur?`شکریہ\n${me}\n${db.cname}`:`Thank you\n${me}\n${db.cname}`;
  if(kind==='abs')return ur?`${head}\n${s.name} آج (${fmtDate(today())}) ٹیوشن پر غیر حاضر ہے۔ خیریت ہو۔\n\n${sign}`:`${head}\n${s.name} is absent from tuition today (${fmtDate(today())}). We hope all is well.\n\n${sign}`;
  if(kind==='fee')return ur?`${head}\n${s.name} کی ${mn} کی فیس:\nواجب: ${money(d)}\nادا شدہ: ${money(p)}\nباقی: ${money(bal)}\n${bal>0?'براہ کرم باقی فیس ادا کر دیں۔':'الحمدللہ، فیس مکمل ادا ہے۔'}\n\n${sign}`:`${head}\nFee for ${s.name} (${mn}):\nDue: ${money(d)}\nPaid: ${money(p)}\nBalance: ${money(bal)}\n${bal>0?'Please pay the remaining fee.':'Alhamdulillah, the fee is fully paid.'}\n\n${sign}`;
  const r=summary(s,m),a=attOf(s,m),pos=posOf(s,m),rm=db.remarks[s.id+'|'+m];
  const tl=r.rows.filter(x=>x.v!=null).map(x=>`• ${x.t.subject}: ${x.v}/${x.t.total} (${pct(x.v,x.t.total)}%)`).join('\n')||(ur?'• اس مہینے کوئی ٹیسٹ نہیں':'• No tests this month');
  const tot=r.tt?(ur?`کل: ${r.o}/${r.tt} (${r.p}%) گریڈ ${gradeOf(r.p)}${pos?' | پوزیشن '+pos:''}`:`Total: ${r.o}/${r.tt} (${r.p}%) Grade ${gradeOf(r.p)}${pos?' | Position '+pos:''}`):'';
  return ur?`${head}\n${s.name} (${s.id}) کی ${mn} کی رپورٹ\n\nحاضری: حاضر ${a.p} | غیر حاضر ${a.a} | رخصت ${a.l}${a.pc==null?'':' ('+a.pc+'%)'}\n\nٹیسٹ:\n${tl}\n${tot}\n\nفیس: واجب ${money(d)} | ادا ${money(p)} | باقی ${money(bal)}${rm?'\n\nریمارکس: '+rm:''}\n\n${sign}`:`${head}\nMonthly report of ${s.name} (${s.id}) - ${mn}\n\nAttendance: Present ${a.p} | Absent ${a.a} | Leave ${a.l}${a.pc==null?'':' ('+a.pc+'%)'}\n\nTests:\n${tl}\n${tot}\n\nFee: Due ${money(d)} | Paid ${money(p)} | Balance ${money(bal)}${rm?'\n\nRemarks: '+rm:''}\n\n${sign}`}
function msgModal(id,kind,m){const s=db.students.find(x=>x.id===id);if(!s)return;
  openM(`<h3>${kind==='fee'?'Fee reminder':kind==='abs'?'Absent notice':'Progress report'}: ${esc(s.name)}</h3><label>Parent WhatsApp number</label><input id="mp" type="tel" value="${esc(s.gphone||s.phone||'')}" placeholder="03xx xxxxxxx">
  <label>Message (you can edit it)</label><textarea id="mt" rows="12" style="width:100%;padding:10px;font:inherit;border:1px solid #cbd5e1;border-radius:10px">${esc(msgText(s,m,kind))}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="sendWA('${id}')">WhatsApp</button><button class="btn o" onclick="sendSMS('${id}')">SMS</button></div>
  <div class="row" style="margin-top:8px"><button class="btn o" onclick="copyMsg()">Copy</button><button class="btn o" onclick="closeM()">Close</button></div>`)}
function saveNum(id){const s=db.students.find(x=>x.id===id),v=$('#mp').value.trim();if(v&&v!==(s.gphone||s.phone||'')){s.gphone=v;save()}return waNum(v)}
function sendWA(id){const n=saveNum(id);window.open('https://wa.me/'+n+'?text='+encodeURIComponent($('#mt').value),'_blank')}
function sendSMS(id){const n=saveNum(id);location.href='sms:'+(n?'+'+n:'')+'?body='+encodeURIComponent($('#mt').value)}
async function copyMsg(){const t=$('#mt').value;try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){$('#mt').select();toast('Select the text and copy it')}}
function parList(cs,m){const L=act().filter(s=>cs.includes(s.cls));
  return `<div class="card noprint"><h3>Send reports to parents / والدین کو رپورٹ</h3><p class="mu">Month: ${monthName(m)}. Tap a button, check the message, then tap WhatsApp. WhatsApp opens with the message ready and you press send for each child. Language and your name are in Settings.</p></div>`+(L.map(s=>`<div class="card"><div class="who">${av(s,40)}<b>${esc(s.name)}</b></div><div class="mu">${(s.gphone||s.phone)?esc(s.gphone||s.phone):'No number yet (add it in the message screen)'}</div><div class="row" style="margin-top:8px"><button class="btn s" onclick="msgModal('${s.id}','prog','${m}')">Progress report</button><button class="btn s o" onclick="msgModal('${s.id}','fee','${m}')">Fee reminder</button></div></div>`).join('')||empty('No students.'))}
/* ---------- v6 helpers ---------- */
let PH;
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=(s,z=40)=>s&&s.photo?`<img class="av" style="width:${z}px;height:${z}px" src="${s.photo}" alt="">`:`<span class="av" style="width:${z}px;height:${z}px;font-size:${Math.max(10,Math.round(z*.4))}px">${esc(initials(s&&s.name))}</span>`;
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const longDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const rangeLabel=m=>{const last=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();return fmtDate(m+'-01')+' – '+fmtDate(m+'-'+pad(last))};
const DEFNAME='Little Leaders Coaching and Computer Centre';
function applyBrand(){const h=$('#hname');if(h)h.textContent=db.cname||DEFNAME;const u=$('#hsub');if(u&&u.style)u.style.display=(db.cname||DEFNAME)===DEFNAME?'':'none';try{document.title=db.cname||'Little Leaders'}catch(e){}}
let PHID=null;
const avEdit=(s,z)=>`<button class="avb" onclick="pickPhoto('${s.id}')" aria-label="Change photo">${av(s,z)}<i>📷</i></button>`;
function pickPhoto(id,cam){PHID=id;const i=$('#phg');i.value='';if(cam)i.setAttribute('capture','user');else i.removeAttribute('capture');i.click()}
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const z=240,c=document.createElement('canvas');c.width=c.height=z;const m=Math.min(im.naturalWidth,im.naturalHeight);c.getContext('2d').drawImage(im,(im.naturalWidth-m)/2,(im.naturalHeight-m)/2,m,m,0,0,z,z);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.8))}catch(e){rej(e)}};im.onerror=()=>{try{URL.revokeObjectURL(u)}catch(e){}rej(new Error('decode'))};im.src=u})}
async function photoGlobal(inp){const f=inp.files&&inp.files[0];if(!f)return;try{setPhoto(PHID,await shrink(f))}catch(e){alert('Could not use this photo. Please choose a JPG or PNG picture.')}try{inp.value=''}catch(e){}}
function setPhoto(id,url){
  if(id==='__form'){PH=url;$('#phv').innerHTML=av({photo:url,name:'?'},64);toast('Photo ready. Tap Save to keep it.');return}
  const s=db.students.find(x=>x.id===id);if(!s)return;s.photo=url;save();
  if(showForm&&editId===id){$('#phv').innerHTML=av(s,64);toast('Photo saved');return}
  toast('Photo saved');render()}
function photoClear(){if(editId){const s=db.students.find(x=>x.id===editId);if(s){delete s.photo;save()}}PH='';const s2=db.students.find(x=>x.id===editId);$('#phv').innerHTML=av(s2||{name:$('#fn')&&$('#fn').value||'?'},64)}
function dailyReport(){const rec=db.att[A.date]||{},ss=inCls(),c={P:0,A:0,L:0};ss.forEach(s=>{if(rec[s.id])c[rec[s.id]]++});const n=c.P+c.A+c.L,ab=ss.filter(s=>rec[s.id]==='A');
  return `<div class="card"><div class="row sp"><h3 style="margin:0">Daily report</h3><button class="btn s o noprint" onclick="doPrint()">🖨 Print</button></div><p class="mu" style="margin:6px 0"><b>${longDate(A.date)}</b> · Class: ${esc(A.cls)}</p>${offD(A.date)?'<p class="mu">Weekly holiday</p>':`<div class="grid" style="margin:6px 0"><div class="stat p"><span>Present</span><strong>${c.P}</strong></div><div class="stat a"><span>Absent</span><strong>${c.A}</strong></div><div class="stat l"><span>Leave</span><strong>${c.L}</strong></div><div class="stat"><span>Not marked</span><strong>${ss.length-n}</strong></div></div>${ab.length?'<p class="mu">Absent: '+ab.map(x=>esc(x.name)).join(', ')+'</p>':''}`}</div>`}
function repHead(){const t={att:'Attendance Report',fee:'Fee Report',res:'Result Sheet',par:'Parent Messages'}[RP.type];return `<div class="card" style="text-align:center">${LOGO}<h2 style="margin:4px 0 0">${esc(db.cname)}</h2><b>${t}</b><div class="mu">${rangeLabel(RP.month)} · Class: ${RP.cls?esc(RP.cls):'All'}</div><div class="mu">Generated on ${fmtDate(today())}</div></div>`}
function feeEditor(){return `<details class="card noprint" ${F.open?'open':''} ontoggle="F.open=this.open"><summary><b>Monthly fee list (edit)</b></summary>${act().map(s=>`<div class="row sp" style="margin-top:8px"><div class="who">${av(s,30)}<span>${esc(s.name)}</span></div><input type="number" min="0" value="${s.fee}" style="width:110px" onchange="setFee('${s.id}',this.value)"></div>`).join('')}</details>`}
function setFee(id,v){const n=parseFloat(v);if(isNaN(n)||n<0){alert('Enter a valid fee.');rFee();return}db.students.find(x=>x.id===id).fee=n;save();toast('Fee updated');F.open=true;rFee()}
/* ---------- Messages (type once, send to every parent) ---------- */
let M={text:'',who:'all',sent:{}};
const TPL=[['abs','Absent','السلام علیکم! {name} آج ٹیوشن پر غیر حاضر ہے۔ خیریت ہو۔ شکریہ','Assalam o Alaikum! {name} is absent from tuition today. We hope all is well. Thank you.'],
 ['fee','Fee reminder','السلام علیکم! {name} کی فیس Rs {balance} باقی ہے۔ براہ کرم ادا کر دیں۔ شکریہ','Assalam o Alaikum! The pending fee for {name} is Rs {balance}. Please pay it. Thank you.'],
 ['hol','Holiday','السلام علیکم! کل ٹیوشن کی چھٹی ہے۔ شکریہ','Assalam o Alaikum! Tuition is closed tomorrow. Thank you.'],
 ['test','Test','السلام علیکم! کل {name} کا ٹیسٹ ہے۔ تیاری کروا دیں۔ شکریہ','Assalam o Alaikum! {name} has a test tomorrow. Please help with preparation. Thank you.'],
 ['meet','Meeting','السلام علیکم! پیرنٹس میٹنگ ہے۔ آپ سے گزارش ہے کہ تشریف لائیں۔ شکریہ','Assalam o Alaikum! There is a parents meeting. You are requested to attend. Thank you.']];
function useTpl(k){const t=TPL.find(x=>x[0]===k);M.text=db.lang==='en'?t[3]:t[2];db.draft=M.text;save();rMsg()}
function recips(){const rec=db.att[today()]||{},m=curMonth();return act().filter(s=>M.who==='absent'?rec[s.id]==='A':M.who==='fee'?dueFor(s,m)-paidFor(s.id,m)>0:true)}
function fillMsg(s,t){const bal=Math.max(0,dueFor(s,curMonth())-paidFor(s.id,curMonth()));return t.replace(/\{name\}/g,s.name).replace(/\{balance\}/g,bal.toLocaleString('en-PK')).replace(/\{id\}/g,s.id)+'\n\n'+(db.teacher||'')+'\n'+(db.cname||'')}
function rMsg(){if(!M.text&&db.draft)M.text=db.draft;
  $('#app').innerHTML=`<h2>Message parents / والدین کو پیغام</h2><div class="card"><label>Quick messages</label><div class="chips">${TPL.map(t=>`<button onclick="useTpl('${t[0]}')">${t[1]}</button>`).join('')}</div>
  <label>Type your message <span class="mu">(use {name} for the child's name, {balance} for pending fee)</span></label><textarea id="mtx" rows="5" oninput="M.text=this.value;db.draft=this.value" onchange="save()" style="width:100%;padding:10px;font:inherit;border:1px solid #cbd5e1;border-radius:10px">${esc(M.text)}</textarea>
  <label>Send to</label><select onchange="M.who=this.value;M.sent={};fillMsgList()"><option value="all" ${M.who==='all'?'selected':''}>All students</option><option value="absent" ${M.who==='absent'?'selected':''}>Absent today</option><option value="fee" ${M.who==='fee'?'selected':''}>Fee pending</option></select>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="sendNext()">Send next ➜</button><button class="btn o" onclick="copyAll()">Copy message</button></div><p class="mu" id="mcount"></p></div><div id="mlist"></div>`;fillMsgList()}
function fillMsgList(){const L=recips();$('#mcount').textContent=L.length+' parent(s) · '+L.filter(s=>M.sent[s.id]).length+' sent. Each tap opens WhatsApp with the message ready; press send there.';
  $('#mlist').innerHTML=L.map(s=>`<div class="card"><div class="who">${av(s,40)}<div style="flex:1;min-width:0"><b>${esc(s.name)}</b><input type="tel" placeholder="Parent number 03xx..." value="${esc(s.gphone||s.phone||'')}" onchange="setNum('${s.id}',this.value)" style="margin-top:4px;padding:7px"></div><button class="btn s ${M.sent[s.id]?'o':''}" onclick="sendOne('${s.id}')">${M.sent[s.id]?'✔ Sent':'WhatsApp'}</button></div></div>`).join('')||empty('No parents match this filter.')}
function setNum(id,v){const s=db.students.find(x=>x.id===id);s.gphone=v.trim();save()}
function sendOne(id){if(!M.text.trim()){alert('Type a message first.');return}const s=db.students.find(x=>x.id===id);M.sent[id]=true;window.open('https://wa.me/'+waNum(s.gphone||s.phone)+'?text='+encodeURIComponent(fillMsg(s,M.text)),'_blank');fillMsgList()}
function sendNext(){const L=recips().filter(s=>!M.sent[s.id]);if(!L.length){toast('All done');return}sendOne(L[0].id)}
async function copyAll(){try{await navigator.clipboard.writeText(M.text);toast('Copied')}catch(e){toast('Select the text and copy it')}}

  const th=[['light','Navy','#0f3d6b'],['ocean','Ocean','#0e7490'],['emerald','Emerald','#047857'],['purple','Purple','#6d28d9'],['maroon','Maroon','#be123c'],['sunset','Sunset','#c2410c'],['dark','Dark','#111c30']],cur=document.documentElement.dataset.theme||'light';

  <div class="card"><h3>Install app</h3>${dip?'<button class="btn" onclick="inst()">📲 Install on this phone</button>':'<p class="mu">'+(standalone()?'The app is installed ✔':'To install: Chrome menu ⋮ → Install app.')+'</p>'}</div>

  <div class="card"><h3>About</h3><p class="mu">Version: ${APP_VER}. Everything is stored only on this phone. Nothing is sent anywhere.</p><div class="row"><button class="btn s o" onclick="checkUpdate()">Check for update</button><button class="btn s o" onclick="refreshApp()">Refresh app (keeps your data)</button></div></div>`}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('llcc_theme',t)}catch(e){}db.theme=t;save();render()}
const APP_VER='v7';let UPD='';
async function refreshApp(){try{if(window.caches){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}}catch(e){}toast('Refreshing...');setTimeout(()=>location.replace(location.pathname+'?r='+Date.now()),300)}
async function checkUpdate(silent){if(!/^https?:$/.test(location.protocol)){if(!silent)toast('Update check works in the online/installed app');return}
  try{const r=await fetch(location.pathname+'?cb='+Date.now(),{cache:'no-store'}),t=await r.text(),m=t.match(/const APP_VER='([^']+)'/);
    if(m&&m[1]!==APP_VER){UPD=m[1];render()}else if(!silent)toast('You have the latest version ('+APP_VER+')')}catch(e){if(!silent)toast('No internet to check for updates')}}
try{if(location.search&&location.search.indexOf('?r=')===0&&history.replaceState)history.replaceState(null,'',location.pathname)}catch(e){}
function wipeAll(){if(!confirm("Delete ALL data on this phone?"))return;if(!confirm("Are you sure? This cannot be undone."))return;db=fix({students:[],att:{},pays:[],next:1,pid:1});save();toast("All data deleted");render()}
function theme(){const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('llcc_theme',n)}catch(e){}}
try{document.documentElement.dataset.theme=localStorage.getItem('llcc_theme')||'light'}catch(e){}
/* ---------- PWA, install, share ---------- */
let dip=null;const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(tab==='set')render()});
addEventListener('appinstalled',()=>{dip=null;toast('App installed');if(tab==='set')render()});
async function inst(){if(!dip)return;dip.prompt();try{await dip.userChoice}catch(e){}dip=null;if(tab==='set')render()}
function net(){const e=$('#net');e.textContent=navigator.onLine?'● Online':'● Offline';e.className='pill'+(navigator.onLine?'':' off')}
addEventListener('online',net);addEventListener('offline',net);net();
function hostedUrl(){const cu=(window.LL_CONFIG||{}).APP_URL;if(cu&&/^https:\/\//.test(cu))return cu;const l=location;if(!/^https?:$/.test(l.protocol)||/^(localhost|127\.|10\.|192\.168\.)/.test(l.hostname))return null;return l.origin+l.pathname.replace(/index\.html$/,'')}
function fmsg(t,ok){const e=$('#fm');e.textContent=t;e.className='fm '+(ok?'ok':'bad')}
function noUrl(){fmsg('This copy is not on a public website yet (it is a local file, preview or localhost). Publish it online first, then open the hosted link and try again. See SETUP.md.',false)}
function manual(u){const f=$('#fu');f.hidden=false;f.value=u;f.focus();f.select();fmsg('Automatic copy was blocked. Press and hold the link above and choose Copy.',false)}
async function copyLink(pre){const u=hostedUrl();if(!u)return noUrl();try{if(isNative())await Capacitor.Plugins.Clipboard.write({string:u});else await navigator.clipboard.writeText(u);$('#fu').hidden=true;fmsg((pre||'')+'Link copied: '+u,true)}catch(e){manual(u)}}
async function shareApp(){const u=hostedUrl();if(!u)return noUrl();
  if(!navigator.share&&!isNative())return copyLink('Sharing is not supported in this browser. ');
  try{const sd={title:'Little Leaders Coaching and Computer Centre',text:'Little Leaders app',url:u};if(isNative())await Capacitor.Plugins.Share.share(sd);else await navigator.share(sd);fmsg('Shared the app link (no student records are shared).',true)}
  catch(e){if(e&&/abort|cancel/i.test(e.name+' '+e.message))fmsg('Share cancelled.',false);else manual(u)}}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!isNative())navigator.serviceWorker.register('sw.js').catch(()=>{});

render();checkUpdate(true);
</script>
</body>
</html>
